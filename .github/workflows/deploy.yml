name: Build & Deploy to VPS

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: r33xcrypt/client-manager:latest

      # A VPS nao aceita SSH vindo da internet (porta 22 fechada; SSH so pela tailnet).
      # O runner entra na tailnet como no EFEMERO (tag:ci) e fala com a VPS pelo IP 100.x.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          ping: 100.106.0.92

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_DIGEST
          script: |
            sudo docker pull "r33xcrypt/client-manager@$IMAGE_DIGEST"
            sudo docker service update --image "r33xcrypt/client-manager@$IMAGE_DIGEST" client_manager_app
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
